/**:
  controller_manager:
    ros__parameters:
      update_rate: 10  # Hz

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      dsr_moveit_controller:
        type: joint_trajectory_controller/JointTrajectoryController

      dsr_controller2:
        type: dsr_controller2/RobotController

      dsr_joint_trajectory:
        type: dsr_joint_trajectory/RobotController

      dsr_joint_publisher:
        type: joint_state_controller/JointStateController

      dsr_position_controller:
        type: forward_command_controller/ForwardCommandController
      
      joint_group_velocity_controller:
        type: velocity_controllers/JointGroupVelocityController

joint_state_broadcaster:
  ros__parameters:
    joints: ['joint_1', 'joint_2', 'joint_3', 'joint_4', 'joint_5', 'joint_6']

dsr_controller2:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
      
dsr_position_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    interface_name: position

    # command_interfaces:
    #   - position
    #   - velocity

    # state_interfaces:
    #   - position
    #   - velocity

dsr_joint_trajectory:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6

    command_interfaces:
      - position
      - velocity

    state_interfaces:
      - position
      - velocity

dsr_moveit_controller:
  ros__parameters:
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    
    # JointTrajectoryController specific parameters
    allow_partial_joints_goal: true
    allow_integration_in_goal_trajectories: true
    open_loop_control: false
    stopped_velocity_tolerance: 0.01
    goal_time: 0.5
    
    constraints:
      goal_time: 0.5
      joint_1:
        trajectory: 1.0
        goal: 0.03
      joint_2:
        trajectory: 1.0
        goal: 0.03
      joint_3:
        trajectory: 1.0
        goal: 0.03
      joint_4:
        trajectory: 1.0
        goal: 0.03
      joint_5:
        trajectory: 1.0
        goal: 0.03
      joint_6:
        trajectory: 1.0
        goal: 0.03

# Velocity controller for MoveIt Servo
joint_group_velocity_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    
    # Interface configuration
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity